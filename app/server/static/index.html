<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocIntel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css?v=17">
  <script src="/static/app.js?v=17" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">◆</span> DocIntel</div>
      <div class="side-scroll">
        <section class="tool">
          <h2>Folder</h2>
          <div class="row">
            <button id="btnBrowse" title="Open the system folder dialog">Browse</button>
            <button id="btnSync" class="ghost">Update index</button>
          </div>
          <div id="state" class="muted"></div>
        </section>

        <section class="tool" id="sourcesTool">
          <div class="tool-head">
            <h2>Sources</h2>
            <button id="btnToggleSrc" class="tool-toggle" aria-expanded="true"
                    aria-controls="sourcesBody" title="Collapse file list">▾</button>
          </div>
          <div id="sourcesBody">
            <div class="row">
              <button id="btnAllSrc" class="ghost">All</button>
              <button id="btnNoneSrc" class="ghost">None</button>
            </div>
            <div id="srcHint" class="muted"></div>
            <div id="sources" class="sources-list">
              <div class="muted">Load a folder to list its files.</div>
            </div>
          </div>
        </section>

        <section class="tool">
          <h2>Insight</h2>
          <input id="path" placeholder="memory.md" autocomplete="off">
          <div class="row">
            <button id="btnInsight">Create</button>
            <button id="btnList" class="ghost">List</button>
          </div>
          <div id="iout" class="result"></div>
        </section>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div class="head-left">
          <div class="title">Ask <span class="muted">· multi-turn RAG over your folder</span></div>
          <div id="workingset" class="workingset"></div>
        </div>
        <button id="btnClear" class="ghost">New chat</button>
      </header>
      <div id="messages" class="messages">
        <div class="inner" id="msglist"></div>
      </div>
      <form id="composer" class="composer">
        <div class="composer-shell">
          <textarea id="aq" rows="1" placeholder="Ask anything about your documents…"></textarea>
          <div class="composer-bar">
            <div class="mode-bar" role="group" aria-label="Answer options">
              <button type="button" id="btnExternal" class="mode-chip" aria-pressed="false"
                      title="Search the web when your folder is not enough">
                <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>
                </svg>
                <span>Web search</span>
              </button>
              <button type="button" id="btnThinking" class="mode-chip" aria-pressed="false"
                      title="Reason before answering — slower, more thorough">
                <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6L12 3z"/>
                  <path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/>
                </svg>
                <span>Think</span>
              </button>
            </div>
            <button id="btnAsk" type="submit" class="send-btn" aria-label="Send" title="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div id="status"></div>
</body>
</html>
