<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>DocIntel — Trợ lý tài liệu</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr;
         font: 14px/1.55 system-ui, sans-serif; background: #1e1f22; color: #e6e6e6; }
  aside { background: #26272b; border-right: 1px solid #34363b; padding: 14px; overflow: auto; }
  main { display: flex; flex-direction: column; height: 100vh; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #9aa0a6; margin: 16px 0 6px; }
  button { background: #34363b; color: #e6e6e6; border: 1px solid #45474d; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #3d4046; }
  button.primary { background: #3b6ef5; border-color: #3b6ef5; color: #fff; }
  .item { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #c9ccd1;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item:hover { background: #313338; }
  .scope { font-size: 12px; color: #9aa0a6; word-break: break-all; margin-bottom: 8px; }
  .composer { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid #34363b; }
  .composer input { flex: 1; background: #17181a; color: #e6e6e6; border: 1px solid #34363b;
                    border-radius: 6px; padding: 10px; font: inherit; }
  #log { flex: 1; overflow: auto; padding: 16px; }
  .msg { margin-bottom: 18px; }
  .msg .role { font-size: 11px; text-transform: uppercase; color: #9aa0a6; margin-bottom: 4px; }
  .msg .body { white-space: pre-wrap; }
  .src { font-size: 12px; color: #9aa0a6; margin-top: 6px; }
  .src div { padding: 1px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <aside>
    <h1>DocIntel</h1>
    <div class="scope" id="scope">Chưa chọn thư mục</div>
    <button id="pick">Chọn thư mục…</button>
    <button id="sync">Cập nhật kho</button>
    <h2>Gần đây</h2>
    <div id="recent"></div>
    <h2>Nguồn trong thư mục</h2>
    <div id="sources"></div>
  </aside>
  <main>
    <div class="composer">
      <input id="query" placeholder="Hỏi, tìm thông tin, hoặc nhờ gợi ý viết…">
      <button class="primary" id="ask">Hỏi</button>
      <button id="suggest">Gợi ý viết</button>
    </div>
    <div id="log"></div>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const call = (m, ...a) => window.pywebview.api[m](...a);

  async function refresh() {
    const st = await call("get_state");
    $("scope").textContent = st.scope || "Chưa chọn thư mục";
    $("recent").innerHTML = "";
    (st.recent || []).forEach((r) => {
      const d = document.createElement("div");
      d.className = "item"; d.textContent = r; d.title = r;
      d.onclick = async () => { await call("set_scope", r); await refresh(); };
      $("recent").appendChild(d);
    });
    const srcs = await call("sources");
    $("sources").innerHTML = "";
    srcs.forEach((s) => {
      const d = document.createElement("div");
      d.className = "item"; d.textContent = s.title || s.path; d.title = s.path;
      $("sources").appendChild(d);
    });
  }

  function addMsg(role, text, sources) {
    const wrap = document.createElement("div"); wrap.className = "msg";
    const r = document.createElement("div"); r.className = "role"; r.textContent = role;
    const b = document.createElement("div"); b.className = "body"; b.textContent = text || "";
    wrap.append(r, b);
    if (sources && sources.length) {
      const s = document.createElement("div"); s.className = "src";
      sources.forEach((x, i) => {
        const d = document.createElement("div");
        d.textContent = `[${i + 1}] ${x.title || "?"} — ${x.section_title_clean || x.section_heading || x.path || ""}`;
        s.appendChild(d);
      });
      wrap.appendChild(s);
    }
    $("log").appendChild(wrap);
    $("log").scrollTop = $("log").scrollHeight;
  }

  async function runSuggestion(useClipboard) {
    const query = $("query").value.trim();
    if (!query) return;
    addMsg("Bạn", query);
    $("query").value = "";
    try {
      await call("sync");
      const clip = useClipboard ? await call("read_clipboard") : "";
      addMsg("Trợ lý", "…");
      const out = await call("suggest", query, clip);
      $("log").lastChild.remove();
      addMsg("Trợ lý", out.suggestion || out.error || "(không có kết quả)", out.sources);
    } catch (e) { addMsg("Lỗi", String(e)); }
  }

  async function runSearch() {
    const query = $("query").value.trim();
    if (!query) return;
    addMsg("Bạn", query);
    $("query").value = "";
    const hits = await call("search", query, 5);
    if (!hits.length) { addMsg("Trợ lý", "Không tìm thấy đoạn liên quan."); return; }
    const text = hits.map((h, i) => `[${i + 1}] ${(h.text || "").slice(0, 300)}`).join("\n\n");
    addMsg("Trợ lý", text, hits);
  }

  $("pick").onclick = async () => { await call("pick_folder"); await refresh(); };
  $("sync").onclick = async () => { await call("sync"); await refresh(); };
  $("ask").onclick = runSearch;
  $("suggest").onclick = () => runSuggestion(true);
  $("query").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

  window.addEventListener("pywebviewready", async () => {
    await refresh();
    const pending = await call("get_pending");
    if (pending && (pending.query || pending.result)) {
      addMsg("Bạn", pending.query || "");
      if (pending.result) addMsg("Trợ lý", pending.result);
    }
  });
</script>
</body>
</html>
